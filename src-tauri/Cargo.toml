[package]
name = "contour"
version = "2.1.0"
description = "Contour - premium 3D world mapping application"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "contour_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-geolocation = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for fetch_with_origin_header (see lib.rs) — the JS-side plugin-http
# fetch() builds its headers via a browser Request/Headers object, which
# silently drops the forbidden "Origin" header name before the request ever
# reaches Rust (confirmed live: Android's WebView does this even though
# desktop's WebView2 doesn't, which is why the ski-tile origin spoof in
# tileCacheProtocol.ts worked on desktop but not Android). A direct reqwest
# call has no such restriction. default-features off + rustls-tls to reuse
# the same pure-Rust TLS stack tauri-plugin-http already pulls in, rather
# than adding a second (native-tls/OpenSSL) one that Android cross-compiles
# poorly.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

